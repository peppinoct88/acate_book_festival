name: Importa copertine dei libri

# Strumento manuale: cerca per ISBN le copertine dei libri in scripts/copertine.json e le salva
# in copertine-candidati/ con un report; la scelta e il ritaglio in src/assets/copertine/ si fanno a mano
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importa:
    name: Copertine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cerca e scarica
        run: |
          pip install --quiet pillow
          python3 scripts/importa-copertine.py

      - name: Salva i candidati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add copertine-candidati
          git diff --cached --quiet || git commit -m "Copertine candidate dei libri degli ospiti"
          git push
